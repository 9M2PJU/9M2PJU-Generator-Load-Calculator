<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>9M2PJU Generator Load Calculator</title>
  <meta name="description" content="9M2PJU Generator Load Calculator helps estimate generator size based on appliances, load factors, and peak demand. Built for Malaysian users.">
  <meta name="keywords" content="Generator Load Calculator, Malaysia, 9M2PJU, Ham Radio, Power Factor, kVA, kW, Electrical Loads">
  <style>
    /* Global */
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
    }
    .container {
      max-width: 1000px;
      margin: auto;
      padding: 1.5rem;
    }
    h1 {
      text-align: center;
      color: white;
      margin-bottom: 1rem;
    }
    .card {
      background: white;
      border-radius: 14px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 3px 10px rgba(0,0,0,0.15);
    }
    h2 {
      margin-bottom: 1rem;
      font-size: 1.2rem;
      color: #444;
    }

    /* Loads */
    #loads-container {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .load-card {
      background: #fafafa;
      border-radius: 10px;
      padding: 1rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      position: relative;
    }
    .load-card h3 {
      font-size: 1rem;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .load-fields {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.75rem;
    }
    .load-fields label {
      display: block;
      font-size: 0.8rem;
      margin-bottom: 0.25rem;
      color: #555;
    }
    .load-fields input, .load-fields select {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 0.9rem;
    }
    .load-total {
      margin-top: 0.5rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: #444;
    }
    .remove-load {
      position: absolute;
      top: 8px;
      right: 8px;
      background: transparent;
      border: none;
      color: #888;
      font-size: 1.2rem;
      cursor: pointer;
    }
    .remove-load:hover {
      color: #e74c3c;
    }
    .btn-add {
      margin-top: 1rem;
      background: #4f46e5;
      color: white;
      font-size: 0.95rem;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }
    .btn-add:hover {
      background: #4338ca;
    }

    /* Results */
    #results {
      background: #f9fafb;
      border-radius: 10px;
      padding: 1rem;
      box-shadow: inset 0 1px 4px rgba(0,0,0,0.08);
    }
    #results h3 {
      margin-bottom: 0.5rem;
    }
    .result-line {
      font-size: 0.95rem;
      margin: 0.25rem 0;
    }

    /* Footer */
    footer {
      text-align: center;
      color: white;
      padding: 1rem 0;
      font-size: 0.9rem;
    }
    footer a {
      color: #ffdf00;
      text-decoration: none;
      font-weight: 600;
    }
    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>9M2PJU Generator Load Calculator</h1>

    <!-- Loads Section -->
    <section class="card">
      <h2>⚡ Loads</h2>
      <div id="loads-container"></div>
      <button id="add-load" class="btn-add">➕ Add Load</button>
    </section>

    <!-- Results Section -->
    <section class="card">
      <h2>📊 Results</h2>
      <div id="results">
        <h3>Calculation Output:</h3>
        <div id="results-content"></div>
      </div>
    </section>
  </div>

  <footer>
    🇲🇾 Made for Malaysia by <a href="https://hamradio.my" target="_blank">9M2PJU</a>
  </footer>

  <script>
    const loadPresets = {
      "lamp": { name: "💡 Lighting", unitPower: 20, factor: 1 },
      "socket": { name: "🔌 Socket Outlet", unitPower: 500, factor: 1 },
      "pc": { name: "🖥 Office Equipment", unitPower: 200, factor: 1 },
      "ac": { name: "❄ Air Conditioner (1.5HP)", unitPower: 1100, factor: 3 },
      "motor": { name: "🛠 Motor (1HP)", unitPower: 750, factor: 3.5 },
      "custom": { name: "✏ Custom", unitPower: 0, factor: 1 }
    };

    function createLoadCard() {
      const card = document.createElement("div");
      card.className = "load-card";

      card.innerHTML = `
        <button class="remove-load">✖</button>
        <h3>⚡ Load</h3>
        <div class="load-fields">
          <div>
            <label>Type</label>
            <select class="load-type">
              ${Object.entries(loadPresets).map(([key, val]) => `
                <option value="${key}">${val.name}</option>
              `).join("")}
            </select>
          </div>
          <div>
            <label>Quantity</label>
            <input type="number" class="load-qty" min="1" value="1">
          </div>
          <div>
            <label>Unit Power (W)</label>
            <input type="number" class="load-power">
          </div>
          <div>
            <label>Starting Factor</label>
            <input type="number" class="load-factor" step="0.1">
          </div>
        </div>
        <div class="load-total">Total: 0 W</div>
      `;

      // Remove
      card.querySelector(".remove-load").addEventListener("click", () => {
        card.remove();
        updateResults();
      });

      // Inputs
      const typeSelect = card.querySelector(".load-type");
      const qtyInput = card.querySelector(".load-qty");
      const powerInput = card.querySelector(".load-power");
      const factorInput = card.querySelector(".load-factor");
      const totalDisplay = card.querySelector(".load-total");

      function updateFromPreset() {
        const preset = loadPresets[typeSelect.value];
        powerInput.value = preset.unitPower;
        factorInput.value = preset.factor;
        updateTotal();
      }

      function updateTotal() {
        const qty = parseFloat(qtyInput.value) || 0;
        const power = parseFloat(powerInput.value) || 0;
        const factor = parseFloat(factorInput.value) || 1;
        const total = qty * power;
        totalDisplay.textContent = 
          `Total: ${total} W (Peak: ${(total * factor).toFixed(1)} W)`;
        updateResults();
      }

      typeSelect.addEventListener("change", updateFromPreset);
      [qtyInput, powerInput, factorInput].forEach(input =>
        input.addEventListener("input", updateTotal)
      );

      updateFromPreset();
      return card;
    }

    function updateResults() {
      const loadCards = document.querySelectorAll(".load-card");
      let totalRunning = 0;
      let totalPeak = 0;

      loadCards.forEach(card => {
        const qty = parseFloat(card.querySelector(".load-qty").value) || 0;
        const power = parseFloat(card.querySelector(".load-power").value) || 0;
        const factor = parseFloat(card.querySelector(".load-factor").value) || 1;
        totalRunning += qty * power;
        totalPeak += qty * power * factor;
      });

      const resultsDiv = document.getElementById("results-content");
      resultsDiv.innerHTML = `
        <div class="result-line">Total Running Load: <strong>${totalRunning} W</strong></div>
        <div class="result-line">Estimated Peak Load: <strong>${totalPeak.toFixed(1)} W</strong></div>
        <div class="result-line">Recommended Generator Size: <strong>${(totalPeak/1000).toFixed(2)} kVA</strong></div>
      `;
    }

    // Add Load Button
    document.getElementById("add-load").addEventListener("click", () => {
      const container = document.getElementById("loads-container");
      container.appendChild(createLoadCard());
    });

    // Start with one load by default
    document.getElementById("loads-container").appendChild(createLoadCard());
  </script>
</body>
</html>
